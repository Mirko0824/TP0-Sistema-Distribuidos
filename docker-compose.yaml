services:
  server:
    build:
      context: ./services/server
      dockerfile: Dockerfile
    container_name: server
    ports: # Expongo el puerto del servidor al Host
      - "5678:5678" # Puerto del Host : Puerto del Contenedor
    environment:
      - PYTHONUNBUFFERED=1
      - SERVER_HOST=server
      - SERVER_PORT=5678
      - AGENCY_QUORUM_MIN=4

  client_0:
    build:
      context: ./services/client
      dockerfile: Dockerfile
    container_name: client_0
    depends_on:
      - server
    environment:
      - AGENCY_ID=0
      - SERVER_HOST=server
      - SERVER_PORT=5678
      - INPUT_FILE=/input/input-0.csv #Defino la variable de entorno INPUT_FILE el archivo que debe leer cada cliente
      - OUTPUT_FILE=/output/output-0.csv #Defino la variable de entorno OUTPUT_FILE el archivo que debe escribir cada cliente
      - BATCH_SIZE=100
    volumes:
      - ./input:/input #Leo el archivo input del Host para cada cliente
      - ./output:/output #Persisto el output en la carpeta /output del Host para cada cliente
  
  client_1:
    build:
      context: ./services/client
